services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: investigation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vipl_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investigation_db"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  vipl_postgres:
